<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Real Video Conversion Test</title>

  <style>

    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    input,
    button {
      margin-top: 10px;
      padding: 12px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #222;
      border-radius: 8px;
      white-space: pre-line;
      word-break: break-word;
    }

  </style>

</head>

<body>

  <h2>Real Video Conversion Test</h2>

  <input
    type="file"
    id="videoFile"
    accept="video/*"
  >

  <br>

  <button
    id="testButton"
  >
    Test Real Video
  </button>

  <div id="status">
    Select a video.
  </div>


  <script>

    const videoFile =
      document.getElementById(
        "videoFile"
      );

    const testButton =
      document.getElementById(
        "testButton"
      );

    const status =
      document.getElementById(
        "status"
      );


    videoFile.addEventListener(
      "change",
      function () {

        if (
          !videoFile.files ||
          !videoFile.files.length
        ) {

          status.textContent =
            "No video selected.";

          return;

        }


        const file =
          videoFile.files[0];


        const sizeMB =
          (
            file.size /
            1024 /
            1024
          ).toFixed(2);


        status.textContent =
          "VIDEO SELECTED\n\n" +

          "File: " +
          file.name +

          "\n\n" +

          "Size: " +
          sizeMB +
          " MB\n\n" +

          "Press Test Real Video.";

      }
    );


    testButton.addEventListener(
  "click",
  async function () {

    if (
      !videoFile.files ||
      !videoFile.files.length
    ) {

      status.textContent =
        "Please select a video first.";

      return;

    }

    const file =
      videoFile.files[0];

    const sizeMB =
      (
        file.size /
        1024 /
        1024
      ).toFixed(2);

    testButton.disabled =
      true;

    status.textContent =
      "VERSION 1 TEST STARTING\n\n" +
      "Starting real conversion request...\n\n" +
      "File: " +
      file.name +
      "\n\n" +
      "Size: " +
      sizeMB +
      " MB";

    try {

      const formData =
        new FormData();

      formData.append(
        "video",
        file
      );

      status.textContent =
        "REAL CONVERSION REQUEST STARTED\n\n" +
        "Sending video to /convert...\n\n" +
        "Please wait.";

      const startTime =
        Date.now();

      const response =
        await fetch(
          "/convert",
          {
            method: "POST",
            body: formData,
            cache: "no-store"
          }
        );

      const elapsed =
        Date.now() -
        startTime;

      const responseText =
        await response.text();

      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status +
          "\n\n" +
          responseText
        );

      }

      status.textContent =
        "VERSION 1 — READY TO CONVERT\n\n" +
        "REAL CONVERSION TEST SUCCESSFUL\n\n" +
        "HTTP: " +
        response.status +
        "\n\n" +
        "Time: " +
        elapsed +
        " ms\n\n" +
        responseText;

    }

    catch (error) {

      status.textContent =
        "VERSION 2 — RELOAD REQUIRED\n\n" +
        "REAL CONVERSION TEST FAILED\n\n" +
        "Error type:\n" +
        (
          error.name ||
          "Unknown"
        ) +
        "\n\n" +
        "Error message:\n" +
        (
          error.message ||
          "No error message"
        ) +
        "\n\n" +
        "File:\n" +
        file.name +
        "\n\n" +
        "Size:\n" +
        sizeMB +
        " MB";

      console.error(
        "Version test failed:",
        error
      );

      await new Promise(
        function (resolve) {
          setTimeout(
            resolve,
            2000
          );
        }
      );

      window.location.reload();

    }

    finally {

      testButton.disabled =
        false;

    }

  }
);

async function runAutomaticTest() {

      status.textContent =
        "AUTOMATIC TEST STARTING\n\n" +
        "Loading server test video...\n\n" +
        "Please wait.";

      try {

        const videoResponse =
          await fetch(
            "/server-test-1sec.mp4?test=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );

        if (
          !videoResponse.ok
        ) {

          throw new Error(
            "Test video HTTP " +
            videoResponse.status
          );

        }

        const videoBlob =
          await videoResponse.blob();

        const testFile =
          new File(
            [
              videoBlob
            ],
            "server-test-1sec.mp4",
            {
              type:
                videoBlob.type ||
                "video/mp4"
            }
          );

        status.textContent =
          "AUTOMATIC TEST VIDEO READY\n\n" +
          "Sending test video to /convert...\n\n" +
          "Please wait.";

        const formData =
          new FormData();

        formData.append(
          "video",
          testFile
        );

        const startTime =
          Date.now();

        const response =
          await fetch(
            "/convert",
            {
              method: "POST",
              body: formData,
              cache: "no-store"
            }
          );

        const elapsed =
          Date.now() -
          startTime;

        const responseText =
          await response.text();

        if (
          !response.ok
        ) {

          throw new Error(
            "HTTP " +
            response.status +
            "\n\n" +
            responseText
          );

        }

        status.textContent =
          "AUTOMATIC TEST SUCCESS\n\n" +
          "VERSION 1 — READY TO CONVERT\n\n" +
          "HTTP: " +
          response.status +
          "\n\n" +
          "Time: " +
          elapsed +
          " ms\n\n" +
          responseText;

      }

      catch (error) {

        status.textContent =
          "AUTOMATIC TEST FAILED\n\n" +
          "VERSION 2 — RELOAD REQUIRED\n\n" +
          "Error type:\n" +
          (
            error.name ||
            "Unknown"
          ) +
          "\n\n" +
          "Error message:\n" +
          (
            error.message ||
            "No error message"
          );

        console.error(
          "Automatic test failed:",
          error
        );

      }

    }

    runAutomaticTest();
    
  </script>

</body>
</html>
