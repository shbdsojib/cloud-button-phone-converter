<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Real Video Conversion Test</title>

  <style>

    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    input,
    button {
      margin-top: 10px;
      padding: 12px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #222;
      border-radius: 8px;
      white-space: pre-line;
      word-break: break-word;
    }

  </style>

</head>

<body>

  <h2>Real Video Conversion Test</h2>

  <input
    type="file"
    id="videoFile"
    accept="video/*"
  >

  <br>

  <button
    id="testButton"
  >
    Test Real Video
  </button>

  <div id="status">
    Select a video.
  </div>


  <script>

    const videoFile =
      document.getElementById(
        "videoFile"
      );

    const testButton =
      document.getElementById(
        "testButton"
      );

    const status =
      document.getElementById(
        "status"
      );


    videoFile.addEventListener(
      "change",
      function () {

        if (
          !videoFile.files ||
          !videoFile.files.length
        ) {

          status.textContent =
            "No video selected.";

          return;

        }


        const file =
          videoFile.files[0];


        const sizeMB =
          (
            file.size /
            1024 /
            1024
          ).toFixed(2);


        status.textContent =
          "VIDEO SELECTED\n\n" +

          "File: " +
          file.name +

          "\n\n" +

          "Size: " +
          sizeMB +
          " MB\n\n" +

          "Press Test Real Video.";

      }
    );


    testButton.addEventListener(
      "click",
      async function () {

        if (
          !videoFile.files ||
          !videoFile.files.length
        ) {

          status.textContent =
            "Please select a video first.";

          return;

        }


        const file =
          videoFile.files[0];


        const sizeMB =
          (
            file.size /
            1024 /
            1024
          ).toFixed(2);


        testButton.disabled =
          true;


        status.textContent =
          "REQUEST STARTING\n\n" +

          "File: " +
          file.name +

          "\n\n" +

          "Size: " +
          sizeMB +
          " MB\n\n" +

          "Creating upload request...";


        try {

          const formData =
            new FormData();


          formData.append(
            "video",
            file
          );


          status.textContent =
            "REQUEST STARTED\n\n" +

            "Uploading video to /convert...\n\n" +

            "Please wait.";


          const startTime =
            Date.now();


          const response =
            await fetch(
              "/convert",
              {
                method: "POST",
                body: formData,
                cache: "no-store"
              }
            );


          const elapsed =
            Date.now() -
            startTime;


          status.textContent =
            "SERVER RESPONSE RECEIVED\n\n" +

            "HTTP: " +
            response.status +

            "\n\n" +

            "Time: " +
            elapsed +
            " ms\n\n" +

            "Reading response...";


          const responseText =
            await response.text();


          if (
            !response.ok
          ) {

            throw new Error(
              "HTTP " +
              response.status +
              "\n\n" +
              responseText
            );

          }


          status.textContent =
            "CONVERSION SUCCESSFUL\n\n" +

            "HTTP: " +
            response.status +

            "\n\n" +

            "Time: " +
            elapsed +
            " ms\n\n" +

            responseText;

        }


        catch (error) {

          status.textContent =
            "CONVERSION REQUEST FAILED\n\n" +

            "Error type:\n" +

            (
              error.name ||
              "Unknown"
            ) +

            "\n\n" +

            "Error message:\n" +

            (
              error.message ||
              "No error message"
            ) +

            "\n\n" +

            "File:\n" +

            file.name +

            "\n\n" +

            "Size:\n" +

            sizeMB +
            " MB";

          console.error(
            "Real video test failed:",
            error
          );

        }


        finally {

          testButton.disabled =
            false;

        }

      }
    );

  </script>

</body>
</html>
