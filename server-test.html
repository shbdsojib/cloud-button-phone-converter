<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Server Conversion Test</title>

  <style>

    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #222;
      white-space: pre-line;
      border-radius: 8px;
    }

  </style>

</head>

<body>

  <h2>Server Conversion Test</h2>

  <button
    id="testButton"
  >
    Run Server Test
  </button>

  <div id="status">
    Ready.
  </div>


  <script>

    const testButton =
      document.getElementById(
        "testButton"
      );

    const status =
      document.getElementById(
        "status"
      );


    testButton.addEventListener(
      "click",
      async function () {

        testButton.disabled =
          true;

        status.textContent =
          "TEST RUNNING\n\n" +
          "Attempt started...";


        try {

          const videoResponse =
            await fetch(
              "/server-test-video?test=" +
              Date.now(),
              {
                method: "GET",
                cache: "no-store"
              }
            );


          if (
            !videoResponse.ok
          ) {

            throw new Error(
              "Test video request failed. HTTP " +
              videoResponse.status
            );

          }


          const blob =
            await videoResponse.blob();


          if (
            !blob ||
            blob.size === 0
          ) {

            throw new Error(
              "Test video is empty."
            );

          }


          status.textContent =
            "TEST RUNNING\n\n" +
            "Test video received: " +
            blob.size +
            " bytes\n\n" +
            "Sending to /convert...";


          const file =
            new File(
              [blob],
              "server-test-1sec.mp4",
              {
                type: "video/mp4"
              }
            );


          const formData =
            new FormData();


          formData.append(
            "video",
            file
          );


          const startTime =
            Date.now();


          const response =
            await fetch(
              "/convert",
              {
                method: "POST",
                body: formData,
                cache: "no-store"
              }
            );


          const elapsed =
            Date.now() -
            startTime;


          const responseText =
            await response.text();


          if (
            !response.ok
          ) {

            throw new Error(
              "HTTP " +
              response.status +
              "\n\n" +
              responseText
            );

          }


          status.textContent =
            "SERVER TEST SUCCESSFUL\n\n" +

            "HTTP: " +
            response.status +

            "\n\n" +

            "Time: " +
            elapsed +
            " ms\n\n" +

            responseText;

        }


        catch (error) {

          status.textContent =
            "SERVER TEST FAILED\n\n" +

            "Error type: " +
            (
              error.name ||
              "Unknown"
            ) +

            "\n\n" +

            "Error message:\n" +

            (
              error.message ||
              "No error message"
            );

          console.error(
            "Server test failed:",
            error
          );

        }


        finally {

          testButton.disabled =
            false;

        }

      }
    );

  </script>

</body>
</html>
